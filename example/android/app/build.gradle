plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
  id "com.facebook.react"
}

android {
  namespace "com.paymentsdkexample"
  ndkVersion rootProject.ext.ndkVersion
  compileSdkVersion rootProject.ext.compileSdkVersion

  packaging {
    jniLibs.pickFirsts.add("**/**/**.so")
  }

  defaultConfig {
    applicationId "com.paymentsdkexample"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1
    versionName "1.0"
  }

  signingConfigs {
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
    release {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }
  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      signingConfig signingConfigs.release
      minifyEnabled false
      proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.facebook.react:hermes-android"
  implementation "androidx.core:core:1.18.0"
  implementation "androidx.core:core-ktx:1.18.0"
  implementation project(':paytabs_react-native-paytabs')
}

configurations.all {
  resolutionStrategy {
    // Use compatible AndroidX versions for PayTabs SDK 6.8.8 with Android 16 support
    force 'androidx.activity:activity:1.13.0'
    force 'androidx.activity:activity-ktx:1.13.0'
    force 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    force 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    force 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    force 'androidx.lifecycle:lifecycle-common:2.6.2'
    force 'androidx.core:core:1.18.0'
    force 'androidx.core:core-ktx:1.18.0'
    force 'androidx.recyclerview:recyclerview:1.3.0'
    force 'androidx.fragment:fragment:1.8.9'
    force 'androidx.fragment:fragment-ktx:1.8.9'
    force 'androidx.appcompat:appcompat:1.7.1'
    force 'androidx.appcompat:appcompat-resources:1.7.1'
    force 'androidx.constraintlayout:constraintlayout:2.2.1'
    force 'com.google.errorprone:error_prone_annotations:2.18.0'
  }
  exclude group: 'androidx.camera'
  exclude group: 'androidx.profileinstaller'
}
