workflows:
  react-native-library:
    name: React Native Library Build & Publish
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - npm_credentials # Add NPM_TOKEN in Codemagic UI
      vars:
        NODE_VERSION: 18
      node: $NODE_VERSION
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
          source: true
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          yarn install
      - name: Lint code
        script: |
          yarn lint
      - name: Run tests
        script: |
          yarn test
      - name: Build library
        script: |
          yarn prepare
      - name: Build Android
        script: |
          cd android
          ./gradlew assembleRelease
      - name: Build iOS (Pod lib lint)
        script: |
          cd ios
          pod lib lint ../react-native-paymentsdk.podspec --allow-warnings
    artifacts:
      - android/build/outputs/**/*.aar
      - lib/**/*
    publishing:
      email:
        recipients:
          - muhammad.alkady@paytabs.com
        notify:
          success: true
          failure: true

  publish-npm:
    name: Publish to NPM
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      groups:
        - npm_credentials # Add NPM_TOKEN in Codemagic UI
      vars:
        NODE_VERSION: 18
      node: $NODE_VERSION
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          yarn install
      - name: Build library
        script: |
          yarn prepare
      - name: Configure npm authentication
        script: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
      - name: Publish to npm
        script: |
          npm publish --access public
    publishing:
      email:
        recipients:
          - muhammad.alkady@paytabs.com
        notify:
          success: true
          failure: true

  android-build:
    name: Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - android_credentials
      vars:
        NODE_VERSION: 18
      node: $NODE_VERSION
      java: 17
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          yarn install
      - name: Build library
        script: |
          yarn prepare
      - name: Build Android library
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/build/outputs/**/*.aar
    publishing:
      email:
        recipients:
          - muhammad.alkady@paytabs.com
        notify:
          success: false
          failure: true

  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        NODE_VERSION: 18
        XCODE_VERSION: 15.0
      node: $NODE_VERSION
      xcode: latest
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          yarn install
      - name: Build library
        script: |
          yarn prepare
      - name: Install CocoaPods dependencies
        script: |
          cd example/ios
          pod install
      - name: Build iOS example
        script: |
          cd example/ios
          xcodebuild -workspace PaymentsdkExample.xcworkspace \
            -scheme PaymentsdkExample \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build
    publishing:
      email:
        recipients:
          - muhammad.alkady@paytabs.com
        notify:
          success: false
          failure: true

  example-android:
    name: Example App - Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - AndroidSampleKey
      groups:
        - firebase
      vars:
        PACKAGE_NAME: "com.paymentsdkexample"
        NODE_VERSION: 18
      node: $NODE_VERSION
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          yarn install
      - name: Build library
        script: |
          yarn prepare
      - name: Build Android example app
        script: |
          cd example/android
          ./gradlew assembleRelease
    artifacts:
      - example/android/app/build/outputs/**/*.apk
      - example/android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - mobile.devop@paytabs.com
        notify:
          success: true
          failure: true
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT_CREDENTIALS
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - Testers

  example-ios:
    name: Example App - iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Paytabs
    environment:
      groups:
        - firebase
      xcode: latest
      cocoapods: default
      node: $NODE_VERSION
      vars:
        NODE_VERSION: 18
        XCODE_VERSION: 15.0
        XCODE_WORKSPACE: example/ios/PaymentsdkExample.xcworkspace
        XCODE_SCHEME: PaymentsdkExample
        EXPORT_METHOD: app-store
        RELEASE_NOTES: "Automated build from Codemagic"
    scripts:
      - name: Install dependencies
        script: |
          yarn install
      - name: Build library
        script: |
          yarn prepare
      - name: Install CocoaPods dependencies
        script: |
          cd example/ios
          pod install --repo-update
      - name: Build IPA for App Store distribution
        script: |
          xcode-project build-ipa \
          --workspace "$XCODE_WORKSPACE" \
          --scheme "$XCODE_SCHEME" \
          --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - example/ios/build/**/*.ipa
      - example/ios/build/**/*.xcarchive
    publishing:
      email:
        recipients:
          - mobile.devop@paytabs.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false


  example-combined:
    name: Example App - Combined Build (iOS & Android)
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Paytabs
    environment:
      android_signing:
        - AndroidSampleKey
      groups:
        - firebase
      vars:
        PACKAGE_NAME: "com.paymentsdkexample"
        NODE_VERSION: 18
        XCODE_VERSION: 15.0
        XCODE_WORKSPACE: example/ios/PaymentsdkExample.xcworkspace
        XCODE_SCHEME: PaymentsdkExample
        EXPORT_METHOD: app-store
        RELEASE_NOTES: "Automated build from Codemagic"
      node: $NODE_VERSION
      xcode: latest
      cocoapods: default
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          yarn install
      - name: Build library
        script: |
          yarn prepare
      - name: Install CocoaPods dependencies
        script: |
          cd example/ios
          pod install --repo-update
      - name: Build iOS example app
        script: |
          xcode-project build-ipa \
          --workspace "$XCODE_WORKSPACE" \
          --scheme "$XCODE_SCHEME" \
          --archive-flags="-destination 'generic/platform=iOS'"
      - name: Build Android example app
        script: |
          cd example/android
          ./gradlew assembleRelease
    artifacts:
      - example/ios/build/**/*.ipa
      - example/ios/build/**/*.xcarchive
      - example/android/app/build/outputs/**/*.apk
      - example/android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - mobile.devop@paytabs.com
        notify:
          success: true
          failure: true
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT_CREDENTIALS
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - Testers
        ios:
          app_id: $FIREBASE_IOS_APP_ID
          groups:
            - Testers
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false


