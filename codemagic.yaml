workflows:

  publish-npm:
    name: Publish to NPM
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      groups:
        - npm_credentials
      vars:
        NODE_VERSION: 18
      node: $NODE_VERSION
    scripts:
      - name: Install dependencies
        script: bash scripts/install-dependencies.sh
      - name: Build library
        script: bash scripts/build-library.sh
      - name: Setup git credentials
        script: bash scripts/setup-git.sh
      - name: Read current version
        script: bash scripts/read-version.sh
      - name: Bump version
        script: bash scripts/bump-version.sh
      - name: Update CHANGELOG with bug fix
        script: bash scripts/update-changelog.sh
      - name: Update README with new version
        script: bash scripts/update-readme.sh
      - name: Push bumped version to build branch
        script: bash scripts/push-version.sh
      - name: Create release branch
        script: bash scripts/create-release-branch.sh
      - name: Create and push git tag
        script: bash scripts/create-tag.sh
      - name: Configure npm authentication
        script: bash scripts/configure-npm.sh
      - name: Publish to npm
        script: bash scripts/publish-npm.sh
    publishing:
      email:
        recipients:
          - mobile.devop@paytabs.com
        notify:
          success: true
          failure: true



  example-android:
    name: Example App - Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - AndroidSampleKey
      groups:
        - firebase
      vars:
        GRADLE_USER_HOME: ~/.gradle
        PACKAGE_NAME: "com.paymentsdkexample"
        NODE_VERSION: 18
      node: $NODE_VERSION
      java: 17
    scripts:
      - name: Install dependencies
        script: bash scripts/install-example-deps.sh
      - name: Build Android example app
        script: bash scripts/build-android-release.sh
    artifacts:
      - example/android/app/build/outputs/**/*.apk
      - example/android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - mobile.devop@paytabs.com
        notify:
          success: true
          failure: true
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT_CREDENTIALS
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - Testers

  example-ios:
    name: Example App - iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Paytabs
    environment:
      groups:
        - firebase
        - environment_variables
      ios_signing:
        provisioning_profiles:
          - $PROFILE
        certificates:
          - $CERTIFICATE
      xcode: latest
      cocoapods: default
      node: $NODE_VERSION
      vars:
        NODE_VERSION: 18
        XCODE_WORKSPACE: example/ios/PaymentsdkExample.xcworkspace
        XCODE_SCHEME: PaymentsdkExample
        EXPORT_METHOD: app-store
        RELEASE_NOTES: "Automated build from Codemagic"
        COCOAPODS_DISABLE_STATS: true
    scripts:
      - name: Install dependencies
        script: bash scripts/install-example-deps.sh
      - name: Fix boost.podspec checksum issue
        script: |
          cd example
          bash scripts/fix-boost.sh
      - name: Install CocoaPods dependencies
        script: bash scripts/install-cocoapods.sh
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: bash scripts/increment-build-number.sh
      - name: Ensure Node binary is available for Xcode
        script: bash scripts/setup-node-binary.sh
      - name: Install root dependencies for bundling
        script: bash scripts/install-root-deps.sh
      - name: Pre-bundle React Native for Release
        script: bash scripts/bundle-react-native-ios.sh
      - name: Build IPA for App Store distribution
        script: |
          xcode-project build-ipa \
          --workspace "$XCODE_WORKSPACE" \
          --scheme "$XCODE_SCHEME" \
          --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - example/ios/build/**/*.ipa
      - example/ios/build/**/*.xcarchive
    publishing:
      email:
        recipients:
          - mobile.devop@paytabs.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false


  example-combined:
    name: Example App - Combined Build (iOS & Android)
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Paytabs
    environment:
      android_signing:
        - AndroidSampleKey
      groups:
        - firebase
        - environment_variables
      ios_signing:
        provisioning_profiles:
          - $PROFILE
        certificates:
          - $CERTIFICATE
      vars:
        GRADLE_USER_HOME: ~/.gradle
        PACKAGE_NAME: "com.paymentsdkexample"
        NODE_VERSION: 18
        XCODE_WORKSPACE: example/ios/PaymentsdkExample.xcworkspace
        XCODE_SCHEME: PaymentsdkExample
        EXPORT_METHOD: app-store
        RELEASE_NOTES: "Automated build from Codemagic"
        COCOAPODS_DISABLE_STATS: true
      node: $NODE_VERSION
      xcode: latest
      cocoapods: default
      java: 17
    scripts:
      - name: Install dependencies
        script: bash scripts/install-example-deps.sh
      - name: Fix boost.podspec checksum issue
        script: |
          cd example
          bash scripts/fix-boost.sh
      - name: Install CocoaPods dependencies
        script: bash scripts/install-cocoapods.sh
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: bash scripts/increment-build-number.sh
      - name: Ensure Node binary is available for Xcode
        script: bash scripts/setup-node-binary.sh
      - name: Install root dependencies for bundling
        script: bash scripts/install-root-deps.sh
      - name: Pre-bundle React Native for Release
        script: bash scripts/bundle-react-native-ios.sh
      - name: Build iOS example app (IPA)
        script: |
          xcode-project build-ipa \
          --workspace "$XCODE_WORKSPACE" \
          --scheme "$XCODE_SCHEME" \
          --archive-flags="-destination 'generic/platform=iOS'"
      - name: Build Android example app
        script: bash scripts/build-android-release.sh
    artifacts:
      - example/ios/build/**/*.ipa
      - example/ios/build/**/*.xcarchive
      - example/android/app/build/outputs/**/*.apk
      - example/android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - mobile.devop@paytabs.com
        notify:
          success: true
          failure: true
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT_CREDENTIALS
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - Testers
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false


